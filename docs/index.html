량으로 나눈다. 쿠폰·멤버십 적립금은 현금 가격에서 빼지 않았고 실결제 가격이라고 표현하지 않았다.", "sources": ["D01", "D02", "D04", "D05", "D06", "C01"]}, {"number": 6, "kicker": "THE SHIPPING TRAP", "title": "21,580원보다 23,900원이 더 저렴할 수 있다", "subtitle": "더단백 초코 250mL 18개 · 같은 구성의 배송비 포함 비교", "notes": "다나와에 재게시된 11번가 상품가는 21,580원이지만 배송비 3,000원을 더하면 24,580원이다. 쿠팡 직접 화면은 23,900원·무료배송이었다. 따라서 상품가만 고르면 이 사례에서는 680원을 더 지불하게 된다. 두 값 모두 관측 표시가이며 주문 검증은 아니다.", "sources": ["D01", "C01"]}, {"number": 7, "kicker": "COST PER 20G", "title": "같은 단백질량으로 맞추면 비용은 최대 2.37배", "subtitle": "선택한 판매 구성 중 배송비까지 확인한 최저 관측값", "notes": "그린비아 약 1052원, 더단백 1328원, 오트몬드 1768원, 마이밀 2367원, 셀렉스 2491원이다. 이는 각 구성에서 확보한 판매처 중 배송비 포함 최소값이다. 가격비교 화면에서 모든 판매처와 모든 묶음을 수집한 것은 아니다.", "sources": ["D01", "D02", "D04", "D05", "D06", "C01"]}, {"number": 8, "kicker": "NUTRITION EFFICIENCY", "title": "열량 대비 단백질은 셀렉스가 가장 높았다", "subtitle": "가격 효율과 영양성분의 효율을 각각 보여준다", "notes": "셀렉스 20g/99kcal는 100kcal당 약 20.2g이다. 그린비아는 20g/120kcal로 약 16.7g이다. 이 비율은 표시 영양성분으로 계산한 지표이며 생체 흡수율이나 전체 품질의 점수가 아니다. 셀렉스 수치는 제조사 공식 자료로도 확인했다.", "sources": ["D01", "D02", "D04", "D05", "D06", "M01"]}, {"number": 9, "kicker": "WHAT QUALITY MEANS", "title": "상세 영양표까지 확인해야 누락을 줄일 수 있다", "subtitle": "더단백 당류 0.8g 반영 · 상품 요약만 보고 미확보로 처리했던 오류 정정", "notes": "최초 조사에서 더단백 상품 요약에 당류가 없다는 이유로 상세 이미지까지 확인하지 않고 미확보로 처리했다. 사용자 제공 쿠팡 상세 라벨에서 250mL·105kcal·단백질20g·당류0.8g을 확인해 정정했다. 셀렉스는 공식 0g, 그린비아는 재게시 1g, 오트몬드는 재게시 0g이다. 마이밀은 현재 판매 구성의 상세 라벨 검토가 아직 완료되지 않은 상태이며 정보가 공개되지 않았다는 뜻이 아니다. 100% WPI 원료 사용이라는 말은 음료 전체가 단백질이라는 뜻이 아니며 원료 유형을 우열 점수로 바꾸지 않았다.", "sources": ["C02", "D02", "D04", "D05", "D06", "M01"]}, {"number": 10, "kicker": "A TRADE-OFF, NOT A MAGIC SCORE", "title": "최저 비용과 최소 열량은 같은 선택이 아니다", "subtitle": "왼쪽은 저렴함 · 아래쪽은 같은 단백질량에서 열량이 낮음", "notes": "비용과 단백질 20g당 열량을 나란히 비교한다. 가중치를 임의로 정한 종합 품질 점수는 만들지 않았다. 원료 선호, 실제 맛, 소화 경험, 알레르기는 이 차트로 판단할 수 없다.", "sources": ["D01", "D02", "D04", "D05", "D06", "C01", "M01"]}, {"number": 11, "kicker": "INDEPENDENT TEST / 2023", "title": "과거 시험에서도 가격이 곧 품질 지표는 아니었다", "subtitle": "한국소비자원 16개 제품 시험 · 2023년 자료, 현재 순위와 분리", "notes": "2023년 8월 발표 보고서의 16개 시험 제품 중 14개는 당시 비교 기준인 아미노산스코어 85 이상이었다. 단백질 1g당 보고 가격은 32–375원이었다. 가장 저렴한 NS포대유청 WPC는 아미노산스코어 127이었다. 서로 다른 유형과 용도의 제품이므로 이 사실을 현재 모든 프로틴에 일반화하지 않는다. 당시 가격은 2023년 2월 기준이고 현재 판매 제품에 이 점수를 붙이지 않았다.", "sources": ["K01"]}, {"number": 12, "kicker": "BUY BY YOUR PRIORITY", "title": "가성비는 ‘내가 무엇을 비교하느냐’에서 갈린다", "subtitle": "가격은 20g당 비용, 성분은 별도 지표로 판단한다", "notes": "이번 관측 구성에서 가격 우선이면 그린비아, 열량 대비 단백질 우선이면 셀렉스가 앞섰다. 이것은 개인별 섭취나 의료 권고가 아닌 비교 데이터의 요약이다. 구매 시에는 같은 맛·용량·단백질 표시·수량·배송비를 다시 확인해야 한다. 결론은 특정 브랜드의 절대적 품질 우위가 아니라 단백질량과 배송비를 맞춰 비교해야 한다는 것이다.", "sources": ["D01", "D02", "D04", "D05", "D06", "C01", "M01"]}, {"number": 13, "kicker": "SOURCES & LIMITS", "title": "가격은 스냅샷, 영양표는 실험 결과와 다르다", "subtitle": "수집 2026.10.18 · 재게시 가격은 판매처·실결제와 차이 날 수 있음", "notes": "소규모 목적 표본으로 시장 전체를 대표하지 않는다. 6팩과 24팩의 구매 부담과 배송비가 다르다. 표시 성분은 실제 함량 실험이 아니다. 2023년 시험은 과거 제품과 당시 가격에만 적용한다. 전체 CSV·분석 코드·제외 사유를 저장소에 보존하고 원문 전문과 인증 파일은 공개하지 않는다.", "sources": ["D01", "D02", "D03", "D04", "D05", "D06", "C01", "C02", "M01", "N01", "M02", "K01"]}]};</script><script src="assets/deck.js"></script></body></html>
